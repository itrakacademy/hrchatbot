  const KB_SHARED = `
RAKA — SHARED POLICIES (apply to both Academic and Administration contract employees unless noted)

WHO WE ARE / VISION / MISSION
- RAK Academy (RAKA), founded 1975 under patronage of HH Sheikh Saud bin Saqr Al Qasimi, Ruler of Ras Al Khaimah.
- Not-for-profit, non-selective, delivers IB and UK National Curriculum across RAK community campuses.
- Vision: "Learning Excellence with a Community Heart." Mission: create a culture of lifelong learning; deliver a broad, balanced, challenging education; create a safe, stimulating, engaging environment.
- Full detailed policies live on RAKA SharePoint: https://rakacademy.sharepoint.com/sites/RAKAcademyFiles. If handbook conflicts with full policy or UAE Labour Law, the full policy / UAE Labour Law takes precedence.
- HR contact: hr@rakacademy.org

CODE OF CONDUCT
- Highest standards of loyalty, integrity, objectivity; no favouritism for personal interest.
- Safety & health are priority; comply with all applicable laws.
- No outside paid work/employment that conflicts with RAKA duties (full-time staff may not hold other jobs).
- RAKA name/logo may not be used outside legitimate work purposes without approval.
- Equal, ethical, respectful treatment of all; honest, fair, consistent management practices.

TIME & ATTENDANCE
- Working hours: Mon–Thu 07:30–15:30 (incl. 30 min lunch); Friday 07:30–11:30. Weekend: Saturday & Sunday.
- Employees must swipe RAKA ID card at entry/exit (attendance register). ID card must be worn at all times; exchange of cards strictly prohibited.
- Unable to attend duty → must notify line manager/Head of School immediately.
- Full-time staff may not hold outside jobs or misuse RAKA/client assets.
- Ramadan: working hours reduced by 2 hours for all staff. Non-fasting staff must eat/drink/smoke only in designated rooms, not in public spaces.

DRESS CODE
- Professional dress per RAKA Dress Code and role requirements (uniform where applicable).
- Video calls: professional / at least "business casual". External representation: professional appearance.
- Fridays: "business casual" (Academic handbook) / "smart casual — Casual Friday" (Admin handbook) within acceptable standards.

EQUIPMENT, TECHNOLOGY, VEHICLES & PROPERTY
- RAKA property/assets are for work purposes only, per prescribed use.
- Fines/penalties from inappropriate use of RAKA vehicles/equipment are borne by the employee.
- Misuse or defacing property → disciplinary action.
- All RAKA property must be returned to HR & IT at separation.

TRANSFER
- Transfers within RAKA or between RAKA entities are subject to approval, guidelines, and vacancy availability.

PROBATIONARY PERIOD
- 6 months from date of joining for full-time (incl. temporary) employees.
- Either party may terminate per notice terms in the probation/separation policy.
- Leave is available during probation per policy; performance is reviewed before confirmation.
- Transferring to another role/entity within the group does not require a new probation period.

HIRING OF RELATIVES
- Hiring immediate family in the same entity is discouraged but may be approved by the Executive Principal.

NEW HIRE MOBILISATION
- Provides relocation entitlements for permanent employees recruited from outside the UAE.

WORKFORCE PLANNING & RECRUITMENT
- Annual workforce planning tied to budget cycle, approved by the RAKA Board; considers diversity (nationality, gender, special needs).
- Temporary appointments allowed to cover absence/special projects, subject to approval.
- Selection: merit-based, equal opportunity; priority to qualified UAE Nationals.
- Candidate age: minimum 18, maximum 60 (60+ only for hard-to-fill roles in exceptional cases).
- Process may include interviews, competency-based assessment, psychometric/cognitive testing.
- False/omitted info in application or interview → disciplinary action.
- Minimum of 2 positive references required from previous employers.
- Emiratisation: preference to UAE Nationals who meet role requirements; dedicated career development for UAE Nationals.

ORIENTATION & ONBOARDING
- Ongoing process starting day one; HR runs a joining-day orientation session; handbook given and should be reviewed.
- Overseas joiners get UAE/RAK culture information; onboarding pack sent ~2 weeks before joining.

REWARDS & RECOGNITION
- Categories: Recognizing Performance, Recognizing Behaviours & Values, Recognizing Length of Service.

CAREER DEVELOPMENT & SUCCESSION PLANNING
- Career Development Programs (CDP) available for employees showing managerial potential; completion may or may not lead to increased responsibility/reward.
- Strategies: coaching, mentoring, on-the-job training, job rotation.
- Succession Plans developed by Dept Heads & HR for critical positions, approved by Executive Principal; promotions occur when a vacancy exists and performance standards are met.

INTERNSHIP
- Interns follow same working hours as employees; line managers mentor and give feedback.
- Interns must: meet eligibility criteria, follow the Code of Conduct, complete assignments on time, maintain confidentiality, notify HR of absence, return RAKA property on leaving.

LEAVE — PUBLIC HOLIDAYS
- Per UAE Government/Ministry of Education declarations; Islamic holidays subject to moon sighting (HR confirms dates).
- Full pay for public holidays that would otherwise be working days; a holiday on a non-working day does not accrue as extra leave.
- Public holidays during sick leave count as part of sick leave.

LEAVE — COMPASSIONATE LEAVE
- 5 calendar days full pay for death of a First Degree Relative; 3 calendar days full pay for a Second Degree Relative.
- Possible additional unpaid leave for a First Degree Relative death, at Executive Principal's discretion.
- May combine with other leave (subject to approval). Public holidays during it count as part of it.
- On return, submit a leave form on ERP with evidence of the death and relationship degree.

LEAVE — STUDY LEAVE
- For continuing education / professional qualification, when classes/exams fall in working hours.
- Allowance: 5 paid working days in year 1 of service; 10 paid working days per calendar year from year 2 onward. Days need not be consecutive.
- Must be part of an approved Individual Development Plan / annual training plan.
- May combine with Annual Leave (subject to approval). Public/national holidays during Study Leave are NOT counted as part of it. Pay & allowances continue.

LEAVE — HAJJ LEAVE
- One-time unpaid leave, up to 30 consecutive calendar days, for Muslim employees after 12 months of service.
- Must notify Head of Department & HR at least 60 days before starting.
- Must submit leave form + proof of travel to Saudi Arabia (visa/passport stamps) between 1st–15th Zulhajjah.
- May combine with annual leave (approval required). Sick leave taken during Hajj Leave counts as part of Hajj Leave; sickness AFTER returning is handled under normal Sick Leave policy (valid medical report required).

LEAVE — PATERNITY LEAVE
- 5 working days full pay following birth of a child.
- Must be used within first 6 months after birth; subject to Head of Department/HR approval; may be taken in one go or split (capped at 5 days total).

LEAVE — MATERNITY LEAVE
- 45 calendar days full pay from day one of employment, then a further 15 calendar days at half pay (i.e., 45 full pay + 15 half pay).

LEAVE — MARRIAGE LEAVE
- 3 working days paid, available once only during the employee's entire employment with RAKA (full-time, confirmed employees).

LEAVE — UAE NATIONAL SERVICE LEAVE
- Available to UAE national employees; HR must be informed of start/end dates with a leave form + enrolment letter.
- May combine with annual leave (approval required). Salary & allowances continue throughout.

LEAVE — SICK LEAVE
- Up to 90 calendar days per year, available only after successful completion of probation. May be continuous or intermittent.
  • First 15 days: full pay
  • Next 30 days: half pay
  • Following 45 days (or beyond): no pay
- Requires a valid medical certificate from a registered UAE Ministry of Health (MOH) clinic/hospital, even for a single day's absence. Foreign/overseas certificates are NOT accepted.

LEAVE — UNPAID LEAVE
- Requires written justification; requests without valid reason are refused.
- Requires written approval from Head of Department/School and Executive Principal (sole discretion, based on business needs), then final approval from HR via ERP.
- Weekends/public holidays within the unpaid leave period count as part of it, EXCEPT those falling at the very start or end of the period.

EMPLOYEE BENEFITS
- Tuition Fee Discount: annual discount for eligible employees' children enrolled at RAKA, per contract/approved structure. Overseas new hires may pay part of tuition to secure a place, later adjusted against their entitlement. Does NOT cover admission/registration, books, transport, exams, uniforms, field trips, extracurriculars, exchange-programme travel, or IT items (Chromebooks, laptops, calculators, tablets, phones).
- Advance Salary Payment: new employees may request a salary advance on joining to help with relocation.
- Health Insurance: provided to all employees on joining, per contract/approved structure.
- Annual Air Ticket Allowance: for employee and qualifying family members, for every 12 months of service, per contract.
- Employee Expenses: claim business expenses via expense claim form + invoice(s), approved by Line Manager, Head of Department, and Executive Principal.
- Employee Discounts: various corporate deals posted on the RAKA SharePoint portal.

PRIVACY — LETTERS & CERTIFICATES
- Employees can request employment/salary certificates via ERP for personal use (banks, embassies, government).
- Certificates must be used only for the stated purpose and not shared with other parties without approval.

PUBLIC HEALTH & SAFETY / SMOKING / DRUGS / ALCOHOL
- Report unsafe conditions, hazards, missing/broken safety devices immediately to line manager.
- Know evacuation procedures (exit signs, fire extinguishers).
- During a public health crisis, updated protocols will be issued; concerns should go to HR immediately.
- Use, sale, purchase or possession of illegal drugs (even off duty) is prohibited → disciplinary action.
- RAKA is a smoke- and tobacco-free organisation: no smoking/vaping/tobacco anywhere on premises, grounds, or RAKA vehicles.

SEPARATION — RESIGNATION (VOLUNTARY)
- Submit a resignation letter to Head of Department/School stating the effective date; notice period must match the employment contract.
- Not completing notice period may lead RAKA to seek damages under UAE Labour Law.
- Employee must keep working normal duties through the notice period.
- RAKA may require the employee to work the notice, take gardening leave, or receive pay in lieu and stop immediately (RAKA's discretion).
- HR conducts an exit interview in the final week.
- Employees confirmed with 1+ year continuous service are eligible for End of Service Benefit.

SEPARATION — RETIREMENT
- UAE Nationals: may retire at 50 with 20+ years' service, or at 60 with 15+ years' service; pension per UAE Labour Law.
- Expatriates: retirement age is 60; may work to 65 with special UAE Government approval.
- HR & Executive Principal may approve/reject requests to continue employment beyond retirement age.

SEPARATION — REDUNDANCY
- May occur due to business needs, market forces, restructuring, or obsolete positions/departments/facilities.
- Redundant employees receive the notice period stated in their contract.

SEPARATION — END OF SERVICE BENEFIT (EOSB)
- UAE Nationals: pension per UAE Labour Law.
- Expatriates with 1+ year of service: entitled to EOSB per UAE Labour Law, paid after notice period, clearance, and visa cancellation.
- Unused accrued annual leave is encashed (basic pay) at final settlement; leave taken in advance of accrual is deducted from final pay.

SEPARATION — REEMPLOYMENT OF SEPARATED EMPLOYEES
- Employees who left via "termination without cause" or resignation and were in good standing may be rehired, subject to Executive Principal approval.

SEPARATION — DEATH & DISABILITY
- All employees covered by RAKA life insurance and workmen's compensation.
- On death in service, last salary + final settlement go to the nominated beneficiary on file, or to dependents per UAE Labour Law if none nominated, or per RAK courts' decision if no dependents/beneficiary.
- Work-related injury: RAKA pays treatment costs and transport for treatment until recovery or proven disability.
- If injury prevents normal duties: full pay/benefits continue for up to 6 months; if treatment exceeds 6 months, half pay continues for a further 6 months (or until recovery/disability proof/death, whichever first).
- Death or disabling injury on duty is compensated per UAE Labour Law.

DISCIPLINARY ACTION
- Any violation of RAKA policy or UAE law can lead to disciplinary action. Examples: breach of contract terms, persistent lateness without approval, unapproved absence / not returning from leave without valid reason, criminal conviction, not following line manager's instructions or policy.
- Employees must report violations to HR.
- The employee will normally get a chance to give their point of view / be fairly heard (except where not possible, e.g. an employee has absconded).

GRIEVANCE
- Employees may raise grievances about any aspect of employment (terms & conditions, working arrangements/environment, relationships, disciplinary action taken against them).
- Submit a written complaint to HR; a meeting is held to discuss it; investigated per the Investigations Policy.
- Outcome only decided after full investigation by the assigned committee.
- Malicious, false, or frivolous grievances → disciplinary action against the raiser.
- All grievances are treated as confidential.
- See also: Bullying and Harassment Policy, Whistle-blower Policy.
`;

  const KB_ADMIN = `
RAKA — ADMINISTRATION CONTRACT SPECIFICS

ORGANISATION (Administration)
- Board of Governors → Executive Principal → Executive Committee, with divisions: Finance (Director of Finance), Education (Executive Vice Principal), HR (Senior HR Manager), Marketing & Enrolment, Operations. Sub-committees: HR Committee, Academic Committee, Audit Committee.
- ~2,600 students, 80+ nationalities, 3 community campuses, IB + British curriculum.

ANNUAL LEAVE (Administration)
- 33 working days of Annual Leave per calendar year (1 July–30 June).
- Eligible to apply only after successful completion of probation; during probation, up to 10 annual leave days may be taken subject to approval.
- Sickness during an annual leave period counts as part of that annual leave, UNLESS the employee cancels the annual leave and applies for sick leave instead.
- Unused leave carry-forward: full accumulated balance may be carried from 1 July to a date in August exactly 14 days before the first day of school for students (following academic year); after that date only 2.75 working days may be carried forward, and that carried-forward balance (2.75 days) must be used by end of December of the current year.
- Public holidays falling within annual leave are NOT deducted from the annual leave balance.
- Leave is requested and approved via the ERP; proceeding on leave without approval risks disciplinary action for the employee and their manager.

COMPENSATORY TIME OFF (Administration — more detail than Academic)
- Given only when the employee is required by RAKA to work a public holiday or weekend (not for voluntary routine work like answering emails).
- Must be approved in writing by both the Line Manager and a Head of Department (Director level), ideally in advance.
- May be combined with annual leave; cannot be carried forward; can be taken any time after accrual.

UNPAID LEAVE (Administration — extra condition)
- An Administration-contract employee may apply for Unpaid Leave only after their full Annual Leave entitlement has been used up.

EMPLOYMENT REFERRAL (Administration / IDO)
- Referral fee: AED 1,000 after onboarding of a referred candidate (via internal job postings), vs AED 500 under the Academic handbook.

PERFORMANCE MANAGEMENT (Administration only)
- Formal performance management drives employee growth; evaluated objectively by immediate supervisors/Department Heads.
- Line Managers give ongoing feedback via monthly "checkpoint" conversations against SMART + Stretched KPIs.
- Formal evaluation twice a year: mid-year (no rating) and year-end (rated) against agreed KPIs.
- 5-point rating scale:
  1 = Underperformance — below minimum acceptable standard.
  2 = Needs Improvement — partially meets standards, inconsistent.
  3 = Meets Expectations — fully meets job standards, valued contribution.
  4 = Exceeds Expectations — noticeably above what's expected.
  5 = Exemplary Contribution — excellent, consistently far exceeds expectations.
- Behavioural competencies (soft skills) make up 30% of the overall annual rating; technical/behavioural skills and training-needs input are also assessed.
- Final ratings for admin employees are discussed/finalised with Head of Department, HR, and the Board, then shared with the employee confidentially.

LEARNING & DEVELOPMENT (Administration — explicit policy)
- RAKA provides training to build technical (job-specific) and behavioural competencies.
- Heads of Department identify L&D needs and plan department L&D budgets against yearly objectives.
- Employees drive their own development (planning, undertaking, evaluating agreed development activities) and must attend training set out in their annual Individual Development Plan (IDP).
- Employees/trainees on a RAKA-sponsored professional qualification must remain employed at RAKA for at least 1 year after completion; resigning earlier triggers a sliding-scale salary deduction to recover training costs.
`;

  function buildSystemPrompt(mode) {
    let scope = KB_SHARED;
    let scopeLabel = 'both the Academic and Administration employee handbooks';

    if (mode === 'admin') { scope = KB_SHARED + '\n' + KB_ADMIN; scopeLabel = 'the Administration contract employee handbook'; }
    if (mode === 'both') { scope = KB_SHARED + '\n' + KB_ACADEMIC + '\n' + KB_ADMIN; scopeLabel = 'both the Academic and Administration employee handbooks'; }

    return `You are the RAK Academy (RAKA) HR Assistant, an internal chatbot for RAKA employees. Answer questions ONLY using the policy knowledge base below, drawn from ${scopeLabel}.

RULES:
- Be concise, warm, and professional — like a helpful HR colleague, not a legal document.
- Only answer using the information in the knowledge base. If something isn't covered, say you don't have that detail in the handbook and suggest the employee contact RAKA HR at hr@rakacademy.org or check the full policy on the RAKA SharePoint (https://rakacademy.sharepoint.com/sites/RAKAcademyFiles).
- If a policy differs between Academic and Administration contracts (e.g. Annual Leave, Employment Referral, Performance Management) and the employee hasn't specified their contract type, briefly note the difference and ask which applies to them — unless the widget context below already tells you their selected contract type.
- Never invent numbers, entitlements, or approval chains that are not in the knowledge base.
- Keep answers short (a few sentences or a short bullet list). Offer to give more detail if useful.
- This is an internal tool — do not discuss anything unrelated to RAKA HR policy.

KNOWLEDGE BASE:
${scope}`;
  }

  root.innerHTML = `

  function svgCrest() {
    return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L4 5v6c0 5.2 3.4 9.4 8 11 4.6-1.6 8-5.8 8-11V5l-8-3z" fill="#0d2f5e"/><path d="M8 9l4 3 4-3" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function svgClose() { return `<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`; }
  function svgSend() { return `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 8 6 8-16-8z" fill="#0d2f5e"/></svg>`; }

  function svgBook() { return `<svg viewBox="0 0 24 24" fill="none" width="22" height="22"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5v-13z" fill="#fff" opacity="0.92"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5v-13z" fill="#fff" opacity="0.7"/></svg>`; }

  // =========================================================
  // 4. DOM refs & events
  // =========================================================
  const panel = root.querySelector('#raka-panel');
  const fab = root.querySelector('#raka-fab');
  const closeBtn = root.querySelector('#raka-close');
  const body = root.querySelector('#raka-body');
  const welcome = root.querySelector('#raka-welcome');
  const input = root.querySelector('#raka-input');
  const sendBtn = root.querySelector('#raka-send');
  const chips = root.querySelectorAll('.raka-chip');
  const suggestChips = root.querySelectorAll('.raka-suggest-chip');

  fab.addEventListener('click', () => { isOpen = !isOpen; panel.classList.toggle('raka-open', isOpen); if (isOpen) input.focus(); });
  closeBtn.addEventListener('click', () => { isOpen = false; panel.classList.remove('raka-open'); });

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('raka-active'));
      chip.classList.add('raka-active');
      mode = chip.dataset.mode;
    });
  });

  suggestChips.forEach(chip => {
    chip.addEventListener('click', () => { input.value = chip.dataset.q; sendMessage(); });
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 90) + 'px';
  });
  sendBtn.addEventListener('click', sendMessage);

  function appendMessage(role, text) {
    if (welcome && welcome.parentNode) welcome.remove();
    const wrap = document.createElement('div');
    wrap.className = 'raka-msg ' + (role === 'user' ? 'raka-user' : 'raka-bot');
    const bubble = document.createElement('div');
    bubble.className = 'raka-bubble';
    bubble.innerHTML = escapeAndFormat(text);
    wrap.appendChild(bubble);
    body.appendChild(wrap);
    body.scrollTop = body.scrollHeight;
    return bubble;
  }

  function escapeAndFormat(text) {
    const esc = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    return esc
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  function showTyping() {
    if (welcome && welcome.parentNode) welcome.remove();
    const wrap = document.createElement('div');
    wrap.className = 'raka-msg raka-bot';
    wrap.id = 'raka-typing-wrap';
    wrap.innerHTML = `<div class="raka-bubble"><div class="raka-typing"><span></span><span></span><span></span></div></div>`;
    body.appendChild(wrap);
    body.scrollTop = body.scrollHeight;
  }
  function hideTyping() {
    const t = root.querySelector('#raka-typing-wrap');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isSending) return;
    input.value = '';
    input.style.height = 'auto';
    appendMessage('user', text);
    history.push({ role: 'user', content: text });
    isSending = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      // Calls a same-origin backend proxy (e.g. an Azure Function at /api/chat)
      // which holds the real Anthropic API key server-side. Do NOT point this
      // at https://api.anthropic.com directly from the browser — that exposes
      // no key (unauthorized) and will typically also be blocked by CORS.
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system: buildSystemPrompt(mode),
          messages: history
        })
      });
      const data = await response.json();
      hideTyping();

      if (!response.ok) {
        console.error('RAKA HR widget: proxy returned an error', data);
        appendMessage('bot', "Sorry, I couldn't generate a response just then. Please try again or contact RAKA HR at hr@rakacademy.org.");
        return;
      }

      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      const answer = textBlocks.join('\n').trim() || "Sorry, I couldn't generate a response just then. Please try again or contact RAKA HR at hr@rakacademy.org.";

      appendMessage('bot', answer);
      history.push({ role: 'assistant', content: answer });
    } catch (err) {
      hideTyping();
      appendMessage('bot', "I'm having trouble connecting right now. Please try again shortly, or reach RAKA HR directly at hr@rakacademy.org.");
      console.error('RAKA HR widget error:', err);
    } finally {
      isSending = false;
      sendBtn.disabled = false;
    }
  }
})();
</script>
