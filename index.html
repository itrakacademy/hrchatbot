  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 28px/100% 29px,
      var(--paper);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px;
  }

  .app{
    width:100%;
    max-width:760px;
    background:var(--white);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:calc(100vh - 56px);
    min-height:560px;
    border:1px solid var(--paper-line);
  }

  /* HEADER */
  .header{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--white);
    padding:22px 26px;
    display:flex;
    align-items:center;
    gap:16px;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:"";
    position:absolute;
    right:-40px; top:-60px;
    width:180px; height:180px;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:50%;
  }
  .crest{
    width:50px;height:50px;border-radius:12px;
    background:var(--white);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    padding:4px;
    box-shadow:0 0 0 3px rgba(255,255,255,0.15), 0 4px 10px rgba(0,0,0,0.15);
  }
  .crest img{
    width:100%;height:100%;object-fit:contain;
  }
  .header-text h1{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 2px;
    letter-spacing:0.2px;
  }
  .header-text p{
    margin:0;
    font-size:12.5px;
    color:var(--gold-soft);
    letter-spacing:0.3px;
  }
  .status-dot{
    margin-left:auto;
    display:flex;align-items:center;gap:6px;
    font-size:11.5px;
    color:rgba(255,255,255,0.75);
    align-self:flex-start;
  }
  .status-dot span.dot{
    width:7px;height:7px;border-radius:50%;
    background:#4ADE80;
    box-shadow:0 0 0 3px rgba(74,222,128,0.2);
  }

  /* TOPIC TABS (table-of-contents inspired) */
  .tabs{
    display:flex;
    gap:8px;
    padding:14px 18px;
    overflow-x:auto;
    background:var(--paper);
    border-bottom:1px solid var(--paper-line);
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;
    background:var(--white);
    border:1px solid var(--paper-line);
    color:var(--navy);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:8px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .tab:hover{
    border-color:var(--gold);
    background:var(--gold-soft);
    color:var(--navy-deep);
  }

  /* CHAT AREA */
  .chat{
    flex:1;
    overflow-y:auto;
    padding:22px 22px 8px;
    display:flex;
    flex-direction:column;
    gap:16px;
    position:relative;
  }
  .chat::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: var(--logo-watermark);
    background-repeat:no-repeat;
    background-position:center 55%;
    background-size:260px;
    opacity:0.05;
    pointer-events:none;
  }
  .chat .msg{position:relative;z-index:1;}
  .msg{
    display:flex;
    gap:10px;
    max-width:86%;
    animation:rise .25s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .msg.bot{align-self:flex-start;}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .avatar{
    width:30px;height:30px;border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;font-family:'Lora',serif;
  }
  .msg.bot .avatar{background:var(--navy);color:var(--gold-soft);}
  .msg.user .avatar{background:var(--gold-soft);color:var(--navy-deep);}
  .bubble{
    padding:12px 15px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.55;
  }
  .msg.bot .bubble{
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-top-left-radius:4px;
    color:var(--ink);
  }
  .msg.user .bubble{
    background:var(--navy);
    color:var(--white);
    border-top-right-radius:4px;
  }
  .bubble p{margin:0 0 8px;}
  .bubble p:last-child{margin-bottom:0;}
  .bubble strong{color:var(--navy);}
  .msg.user .bubble strong{color:var(--gold-soft);}
  .bubble ul{margin:6px 0;padding-left:18px;}
  .bubble li{margin-bottom:4px;}
  .source-tag{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    font-weight:600;
    color:var(--teal);
    background:rgba(28,110,124,0.08);
    padding:3px 9px;
    border-radius:6px;
    letter-spacing:0.2px;
  }

  .typing{
    display:flex;gap:4px;align-items:center;padding:4px 2px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--ink-soft);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}

  /* INPUT */
  .input-row{
    display:flex;
    gap:10px;
    padding:16px 18px 18px;
    border-top:1px solid var(--paper-line);
    background:var(--white);
  }
  .input-row input{
    flex:1;
    border:1.5px solid var(--paper-line);
    border-radius:12px;
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .15s ease;
    background:var(--paper);
  }
  .input-row input:focus{border-color:var(--navy);}
  .input-row button{
    background:var(--navy);
    color:var(--white);
    border:none;
    border-radius:12px;
    padding:0 20px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:background .15s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .input-row button:hover{background:var(--navy-deep);}
  .input-row button:disabled{background:var(--ink-soft);cursor:not-allowed;}

  .disclaimer{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-soft);
    padding:0 18px 14px;
    background:var(--white);
  }

  @media (max-width:480px){
    .app{height:calc(100vh - 20px);border-radius:12px;}
    body{padding:10px;}
    .msg{max-width:92%;}
  }

  /* LANGUAGE TOGGLE */
  .lang-toggle{
    display:flex;
    background:rgba(255,255,255,0.1);
    border-radius:999px;
    padding:3px;
    margin-left:10px;
    flex-shrink:0;
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.65);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11.5px;
    padding:6px 11px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .lang-toggle button.active{
    background:var(--gold);
    color:var(--navy-deep);
  }

  /* RTL (Arabic) MODE */
  html[dir="rtl"] body{
    font-family:'Cairo',sans-serif;
  }
  html[dir="rtl"] .header-text h1,
  html[dir="rtl"] .crest{
    font-family:'Cairo',sans-serif;
  }
  html[dir="rtl"] .status-dot{
    margin-left:0;
    margin-right:auto;
  }
  html[dir="rtl"] .msg.bot .bubble{
    border-top-left-radius:14px;
    border-top-right-radius:4px;
  }
  html[dir="rtl"] .msg.user .bubble{
    border-top-right-radius:14px;
    border-top-left-radius:4px;
  }
  html[dir="rtl"] .bubble ul{padding-left:0;padding-right:18px;}
  html[dir="rtl"] .lang-toggle{margin-left:0;margin-right:10px;}
</style>
</head>

RAKA EMPLOYEE HANDBOOK — ACADEMIC (source document for this assistant)

WELCOME
RAK Academy (RAKA) has been operating since 1975, founded under the patronage of His Highness Sheikh Saud bin Saqr Al Qasimi, Ruler of Ras Al Khaimah. It serves 3,100+ students from 98 nationalities across five community campuses, delivering IB PYP, IB DP, and the UK National Curriculum to students aged 3–18. RAKA's detailed HR policies live on RAKA SharePoint (https://rakacademy.sharepoint.com/sites/RAKAcademyFiles). Where this handbook conflicts with detailed policies or UAE Labour Law, the detailed policies and UAE Labour Law take precedence. Questions go to RAKA Human Resources (hr@rakacademy.org).

VISION: Learning Excellence with a Community Heart.
MISSION: Create a culture of lifelong learning; deliver a broad, balanced, challenging education; create a safe, stimulating, engaging learning environment.

ORGANISATIONAL STRUCTURE: RAK Academy Board → Executive Principal → Academic Committee / Education Division – Executive Vice Principal → Head of School RAKA Al Hamra, Head of School RAKA Al Rams, Head of Primary RAKA Khuzam, Head of Secondary RAKA Khuzam, Head of Inclusion and IB Accreditation.

== WORKING AT RAK ACADEMY ==

Organizational Code of Conduct: Employees must display loyalty, integrity, objectivity, and not favor any party for personal interest.
General Code of Conduct: Safety and health are priorities; actions must never jeopardize health/safety of employees, communities, equipment, or facilities; must comply with applicable laws.
External Business Activity: Employees may not engage in non-RAKA work or paid employment (permanent or temporary) outside, and must avoid conflicts of interest.
Use of RAKA Name: Employees must not use RAKA's name/logo other than for legitimate work purposes; external representation needs prior approval.
Employee Relations: RAKA supports equal, ethical, respectful treatment of all; honest, fair, consistent management practices. Refer to Organizational Code of Conduct Policy.

Time and Attendance:
- Official working hours: Monday–Thursday 07:30 a.m.–03:30 p.m. (incl. 30-min lunch break); Friday 07:30 a.m.–12:00 p.m.
- Saturday and Sunday are weekend days.
- Employees swipe RAKA ID card at entry/exit; card must be worn at all times; exchange of ID cards is strictly prohibited.
- Full-time employees may not hold outside jobs or misuse firm assets/information. Refer to Time and Attendance Policy.

Ramadan: Working hours reduced by two hours during Ramadan for all employees. Non-Muslim/non-fasting employees must refrain from eating, drinking, smoking in public spaces and will be assigned special rooms for meals.

Use of Equipment, Technology, Vehicles and Property: RAKA property is for work purposes only; employee bears expenses (fines, dues, penalties) from inappropriate use; misuse/defacing property triggers disciplinary action; property must be returned to HR & IT at separation. Refer to Use of Equipment, Technology, Vehicles and Property Policy.

Dress Code: Professional dress per RAKA Dress Policy and role requirements; "business casual" minimum on video calls; professional appearance when representing RAKA externally; Fridays allow "business casual" within acceptable standards. Refer to Dress Code and Personal Appearance Policy.

Transfer: Subject to RAKA approval, guidelines, and vacancy availability, whether within same entity or between entities. Refer to Transfer Policy.

Probationary Period: Full-time employees (incl. temporary) serve 6-month probation from date of joining. Employment may be terminated by either party per required notice during probation. Leave is available during probation per policy. Evaluation occurs during probation review; transfers within RAKA group do not require a new probation. Refer to Probationary Period Policy.

Hiring of Relatives: RAKA does not encourage hiring immediate family members in the same entity; may be permissible with Executive Principal approval. Refer to Hiring of Relatives Policy.

New Hire Mobilisation: Details relocation entitlements for permanent employees recruited from outside the UAE. Refer to New Hire Mobilisation Policy.

== WORKFORCE PLANNING AND RECRUITMENT ==

Temporary Employment: Covers absence of permanent staff (emergency/long-term leave) or special projects/unexpected workloads, subject to approvals. Refer to Temporary Employment Policy.

Workforce Planning and Organizational Structure: Conducted annually with budget cycle, subject to RAKA Board approval; considers diversity (nationalities, gender, special needs); org structure reviewed periodically. Refer to Workforce Planning and Organization Structure Policy.

Employment Referral Policy: Employees may refer UAE national or expatriate candidates matching job descriptions for advertised vacancies. Successful referrals for designated positions earn a referral fee of AED 500. Referred candidates may be included in selection purely at RAKA's discretion. Refer to Employment Referral Policy.

Orientation & Onboarding: Orientation starts day one; HR conducts a brief session on joining date for employment documents/joining formalities; new employees receive the handbook; overseas joiners get info on UAE/RAK culture at least two weeks prior to joining. Refer to Orientation & Onboarding Policy.

Selection and Interviews: Merit-based, equal opportunity; priority to UAE Nationals if they meet requirements. Minimum candidate age 18, maximum 60 (60+ only for hard-to-fill positions in exceptional circumstances). Candidates may undergo interviews, competency-based assessment, psychometric/cognitive testing. False/omitted information leads to disciplinary action. Refer to Selection and Interviews Policy.

Reference Checks: Minimum two positive references required from previous employers of selected candidates. Refer to Reference Checks Policy.

Rewards and Recognition: Categories are Recognizing Performance, Recognizing Behaviors and Values, Recognizing Length of Service. Refer to Rewards & Recognition Policy.

Emiratisation Policy: RAKA gives preference to UAE nationals meeting role requirements; career development initiatives launched for UAE nationals based on aspirations, performance, and business needs. Refer to Emiratisation Policy.

== LEAVE ==

Annual Leave: Determined by the Annual Academic Calendar (aligned with UAE Ministry of Education, approved by RAKA management); annual leave is fixed during school summer holidays. First/last year employees get pro-rated leave. Sickness/hospitalization during academic leave counts as part of annual leave entitlement. Refer to Annual Leave Policy.

Public Holidays: Per UAE Government/Ministry of Education; Islamic holidays subject to moon sighting, HR confirms dates. Full pay on public holidays that would otherwise be working days; holidays on non-working days don't accrue as extra leave. Public holidays during sick leave count as part of sick leave. Refer to Public Holidays Policy.

Compassionate Leave: 5 calendar days full pay for death of a First Degree Relative; 3 calendar days full pay for death of a Second Degree Relative. Additional unpaid leave possible for First Degree Relative loss at Executive Principal's discretion. May combine with other leave (approval needed). Public holidays during Compassionate Leave count as part of it. Submit leave form on ERP with evidence of relationship. Refer to Compassionate Leave Policy.

Study Leave: For continuing education/professional qualifications where classes/exams fall in working hours. 5 working days paid in first year of service; 10 working days paid from second year onward per calendar year (non-consecutive allowed). Must be part of approved individual development plan/annual training plan. May combine with Annual Leave (approval needed). Public/national holidays during Study Leave are NOT part of Study Leave; salary/allowances continue. Refer to Study Leave Policy.

Hajj Leave: One-time unpaid leave, up to 30 consecutive calendar days, for Muslim employees after 12 months of service. Must inform Head of Department/School and HR at least 60 days prior. Submit leave form with proof of travel to Saudi Arabia (visa/passport stamps) between 1st–15th Zulhajjah. May combine with annual leave (approval needed). Sick leave during Hajj Leave counts as part of Hajj Leave. Refer to Hajj Leave Policy.

Maternity Leave: Full pay (basic + allowances) for 45 calendar days from day one of joining: first 45 days full pay, following 15 days half pay. Refer to Maternity Leave Policy.

Paternity Leave: 5 working days full pay following birth of child; must be used within first 6 months of birth; subject to HR/line manager approval; may be taken in one go or split (capped at 5 days). Refer to Paternity Leave Policy.

Compensatory Time Off: Compensatory day off if required to work on official holidays/weekends (Sat/Sun) — only when RAKA requires the work, not voluntary routine tasks like checking email. Refer to Compensatory Time Off Policy.

UAE National Service Leave: UAE national employees may apply for leave for national service; HR needs start/end dates and enrolment letter; may combine with annual leave (approval needed); salary/allowances continue during approved leave. Refer to UAE National Service Leave Policy.

Sick Leave: Up to 90 calendar days per year (continuous or intermittent), only after successful probation. Pay: full pay first 15 days; half pay next 30 days; no pay following 45 days (or additional periods). Refer to Sick Leave Policy.

Unpaid Leave: Requires written explanation/justification; requests without valid justification are refused. Needs written approval from Head of Department/School and Executive Principal, then final approval from HR via ERP. Weekends/public holidays within the leave period count as part of Unpaid Leave, except those falling at the very beginning/end. Refer to Unpaid Leave Policy.

== EMPLOYEE BENEFITS ADMINISTRATION ==

Tuition Fee Discount: Annual tuition fee discount for employees' children enrolled at RAKA per employment contract/approved structure. New overseas hires may pay part of tuition to secure a place, adjusted against their discount entitlement. Does NOT cover admission/registration fees, books, transportation, exams, uniforms, field trips, extracurricular activities/events, exchange program travel, or IT items (Chromebooks, laptops, calculators, tablets, phones).

Advance Salary Payments: New employees may request a salary advance upon joining to assist with transition to a new country/Emirate. Refer to policy.

Health Insurance: Provided to all employees upon joining, per contract and approved structure.

Annual Air Tickets Allowance: Employees (and qualifying family members) eligible for annual air ticket allowance for every 12 months of service, per contract.

Employee Expenses: Claim business expenses via expense claim form, submitted to HR with Line Manager/Head of Department/Executive Principal approval and invoice(s).

Employee Discounts and Other Benefits: Diverse discounted benefits/corporate deals posted on RAKA SharePoint portal.

Career Development Programs (CDP): For employees showing managerial potential per RAKA's grading structure; completion may or may not result in increased responsibility/compensatory reward; strategies include coaching, mentoring, on-the-job training, job rotation.

Succession Planning: Department Heads and HR develop Succession Plans for critical positions, approved by Executive Principal; employees encouraged to broaden experience; promotions when vacancy exists and performance standards are met; enables horizontal and vertical movement. Refer to Career Development & Succession Planning Policy.

Internship: Same official working hours as employees; line managers act as mentors; interns must meet eligibility criteria, follow Code of Conduct, complete assignments on time, maintain confidentiality, notify HR of absence, return RAKA property on leaving. Refer to Internship Policy.

== PRIVACY ==

Employees Letter and Certificates Policy: HR can issue employment/salary certificates for personal purposes (banks, embassies, government departments) via ERP request. Letters/certificates must be used only for the stated purpose and not shared without approval. Refer to Employees Letter and Certificates Policy.

== PUBLIC HEALTH AND SAFETY: SMOKING, ILLEGAL DRUGS AND ALCOHOL USE ==

Employees must report health/safety violations and unsafe conditions to line managers immediately; maintain high safety standards; know evacuation procedures (exit signs, fire extinguishers). During a public health crisis, RAKA provides updated protocols; concerns should go to HR immediately. Use, sale, purchase or possession of illegal drugs (even off duty) is prohibited and leads to disciplinary action. RAKA sites are smoke- and tobacco-free — no smoking, e-cigarettes, vapes, pipes, cigars, snuff, or chewing tobacco anywhere on premises, grounds, or RAKA vehicles. Refer to Public Health and Safety Smoking, Illegal Drugs and Alcohol Use Policy.

== SEPARATION ==

Voluntary Separation - Resignation: Submit resignation letter to Head of Department/School with effective date; notice period must match employment contract; RAKA may seek damages under UAE Labour Law if notice isn't completed. Resigning employee continues duties through notice period. RAKA may require the employee to work notice, take gardening leave, or receive payment in lieu and stop immediately. HR conducts exit interview in the last week. Confirmed employees with 1+ year continuous service are eligible for End of Service Benefit.

Involuntary Separation - Retirement: UAE nationals may retire at 50 with 20 years' service, or 60 with 15 years' service, entitled to pension per UAE Labour Law. Expatriate retirement age is 60; may work to 65 with special UAE Government approval. HR/Executive Principal can approve, reject, or require justification for employment beyond retirement age. Refer to Separation Policy.

Redundancy: Positions/departments/facilities may become obsolete due to business needs, market forces, restructuring; redundant employees get notice period per their contract.

End of Service Benefit: UAE Nationals get pension per UAE Labour Law. Expatriates with 1+ year service get end-of-service payment per UAE Labour Law upon separation. Final settlement paid after notice completion, clearance, and visa cancellation. Unused accrued annual leave is encashed (based on basic pay) at final settlement; over-used (not yet accrued) leave is deducted from remaining salary. Refer to End of Service Benefit Policy.

Reemployment of Separated Employees: Employees who left via termination "without cause" or resignation, in good standing, may be rehired subject to Executive Principal approval. Refer to Reemployment of Separated Employees Policy.

Death and Disability Policy: All employees enrolled in RAKA life insurance/workmen's compensation. On death while employed, last salary and final settlement go to nominated beneficiary (or dependents per UAE Labour Law if none named, or per RAK courts if neither exists). For work-related injury: RAKA covers treatment expenses and transport until recovery/proven disability; full pay/benefits continue during treatment for up to 6 months, then half pay for another 6 months (or until recovery/disability proof/death, whichever first). Death or disability while on duty is compensated per UAE Labour Law. Refer to Death and Disability Policy.

== DISCIPLINARY ACTION AND GRIEVANCE ==

Disciplinary Action: Any employee violating policies or UAE laws faces appropriate disciplinary action. Example violations: failing to comply with employment contract terms; persistent lateness without approval; unapproved absence or failing to return from leave without valid reason; criminal conviction; not complying with line manager's instructions or policies. Employees must notify HR of violations. Employees get an opportunity to give their point of view and be fairly heard, unless not possible (e.g., absconding).

Grievance: RAKA supports employees raising grievances about employment terms, working arrangements, environment, relationships, or disciplinary action taken against them. To raise one, submit a written complaint to RAKA HR with as much detail as possible; a meeting follows and the matter is investigated per the Investigations Policy. Outcome determined only after full investigation by the assigned committee. Malicious, false, or frivolous grievances lead to disciplinary action against the raiser. All grievances are treated as confidential. Refer to Disciplinary and Grievance Policy, Bullying and Harassment Policy, and Whistle-blower Policy (latter two to be uploaded).

CONTACT: For further information on RAKA HR Policies, contact the HR Partners / hr@rakacademy.org.
`;

const SYSTEM_PROMPT = `You are the RAKA HR Assistant, a helpful chatbot for Ras Al Khaimah Academy (RAKA) staff. You answer questions using ONLY the information in the RAKA Employee Handbook (Academic) provided below. 

Rules:
- Base every answer strictly on the knowledge base below. Do not invent policy details, numbers, or entitlements that aren't stated.
- Be warm, concise, and professional — like a knowledgeable HR colleague. Use short paragraphs or bullet points for clarity.
- When relevant, name the specific policy the info comes from (e.g. "per the Sick Leave Policy") so the employee knows where to look for full detail.
- If the question is about something not covered in this handbook excerpt, say so plainly and direct the employee to contact RAKA HR (hr@rakacademy.org) or check the full policy on RAKA SharePoint.
- If a question involves a personal/sensitive employment decision (disciplinary matters, specific pay, medical situations, grievances involving named people), give the general policy info available but recommend they speak directly and confidentially with RAKA HR for their specific case.
- Never claim to access an employee's personal HR record — you only know the general handbook content.
- Keep answers focused; don't repeat the entire handbook section, just what's relevant to the question.
- LANGUAGE: Always reply in {{LANG_INSTRUCTION}}. Keep policy/proper nouns (e.g. RAKA, HR, ERP, UAE) as-is even when writing in Arabic.

KNOWLEDGE BASE:
${KNOWLEDGE_BASE}`;

const LANG_INSTRUCTIONS = {
  en: "English",
  ar: "Modern Standard Arabic (Arabic script), regardless of what script the employee typed in"
};

function getSystemPrompt(lang){
  return SYSTEM_PROMPT.replace('{{LANG_INSTRUCTION}}', LANG_INSTRUCTIONS[lang]);
}

const TABS = {
  en: ["Working hours","Annual leave","Sick leave","Maternity leave","Paternity leave","Benefits","Resignation","Dress code","Grievance"],
  ar: ["ساعات العمل","الإجازة السنوية","الإجازة المرضية","إجازة الأمومة","إجازة الأبوة","المزايا","الاستقالة","قواعد اللباس","التظلمات"]
};

const UI = {
  en:{
    title:"RAKA HR Assistant",
    subtitle:"Ras Al Khaimah Academy · Employee Handbook Guide",
    online:"Online",
    placeholder:"Ask about leave, benefits, working hours…",
    send:"Send",
    disclaimer:"Answers are based on the RAKA Employee Handbook (Academic). For binding decisions, confirm with the HR Team.",
    greeting:"Hello! I'm the RAKA HR Assistant. I can answer questions about the Employee Handbook — leave entitlements, working hours, benefits, separation, code of conduct, and more.\n\nWhat would you like to know?",
    you:"You",
    bot:"HR",
    tabPrefix:"Tell me about ",
    error:"Something went wrong reaching the assistant. Please try again, or contact RAKA HR at hr@rakacademy.org.",
    empty:"I couldn't find an answer just now. Please try rephrasing, or contact RAKA HR at hr@rakacademy.org."
  },
  ar:{
    title:"مساعد الموارد البشرية - أكاديمية رأس الخيمة",
    subtitle:"أكاديمية رأس الخيمة · دليل موظفي الأكاديمية",
    online:"متصل",
    placeholder:"اسأل عن الإجازات، المزايا، ساعات العمل…",
    send:"إرسال",
    disclaimer:"تعتمد الإجابات على دليل موظفي أكاديمية رأس الخيمة (القسم الأكاديمي). للقرارات الرسمية، يرجى التأكد مع فريق الموارد البشرية.",
    greeting:"مرحباً! أنا مساعد الموارد البشرية في أكاديمية رأس الخيمة. يمكنني الإجابة عن أسئلتك بخصوص دليل الموظف — استحقاقات الإجازات، ساعات العمل، المزايا، إنهاء الخدمة، مدونة السلوك، والمزيد.\n\nكيف يمكنني مساعدتك؟",
    you:"أنت",
    bot:"موارد بشرية",
    tabPrefix:"أخبرني عن ",
    error:"حدث خطأ أثناء الاتصال بالمساعد. يرجى المحاولة مرة أخرى، أو التواصل مع الموارد البشرية على hr@rakacademy.org.",
    empty:"لم أتمكن من إيجاد إجابة الآن. يرجى إعادة صياغة السؤال، أو التواصل مع الموارد البشرية على hr@rakacademy.org."
  }
};

let currentLang = 'en';

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const tabsEl = document.getElementById('tabs');
const langToggle = document.getElementById('langToggle');

let history = [];

function renderTabs(){
  tabsEl.innerHTML = '';
  TABS[currentLang].forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab';
    b.textContent = t;
    b.onclick = ()=>{ inputEl.value = UI[currentLang].tabPrefix + t; sendMessage(); };
    tabsEl.appendChild(b);
  });
}

function applyLanguage(lang){
  currentLang = lang;
  const t = UI[lang];
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('headerTitle').textContent = t.title;
  document.getElementById('headerSubtitle').textContent = t.subtitle;
  const statusDot = document.getElementById('statusDot');
  statusDot.childNodes[statusDot.childNodes.length-1].textContent = t.online;
  inputEl.placeholder = t.placeholder;
  sendBtn.textContent = t.send;
  document.getElementById('disclaimer').textContent = t.disclaimer;
  langToggle.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  renderTabs();
}

langToggle.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  applyLanguage(btn.dataset.lang);
});

function addMessage(role, html){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? UI[currentLang].you : UI[currentLang].bot;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;
  wrap.appendChild(av);
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function formatBotText(text){
  // basic markdown-ish formatting: bold **text**, bullet lines starting with - or •
  let escaped = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  escaped = escaped.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const lines = escaped.split('\n');
  let html = '';
  let inList = false;
  lines.forEach(line=>{
    const trimmed = line.trim();
    if(trimmed.startsWith('- ') || trimmed.startsWith('• ')){
      if(!inList){ html += '<ul>'; inList = true; }
      html += '<li>' + trimmed.slice(2) + '</li>';
    } else {
      if(inList){ html += '</ul>'; inList = false; }
      if(trimmed.length){ html += '<p>' + trimmed + '</p>'; }
    }
  });
  if(inList) html += '</ul>';
  return html || '<p></p>';
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  addMessage('user', '<p>' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</p>');
  inputEl.value = '';
  sendBtn.disabled = true;

  const typingBubble = addMessage('bot', '<div class="typing"><span></span><span></span><span></span></div>');

  history.push({ role: 'user', content: text });

  try{
    const response = await fetch("https://hrbotcht-bdhmbygdesfmfkhd.westcentralus-01.azurewebsites.net/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: getSystemPrompt(currentLang),
        messages: history
      })
    });
    const data = await response.json();
    let replyText = "";
    if(data && data.content){
      replyText = data.content.map(b => b.type === 'text' ? b.text : '').join('\n');
    }
    if(!replyText){
      replyText = UI[currentLang].empty;
    }
    history.push({ role: 'assistant', content: replyText });
    typingBubble.innerHTML = formatBotText(replyText);
  } catch(err){
    typingBubble.innerHTML = '<p>' + UI[currentLang].error + '</p>';
  }

  chatEl.scrollTop = chatEl.scrollHeight;
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e=>{ if(e.key === 'Enter') sendMessage(); });

applyLanguage('en');
addMessage('bot', formatBotText(UI[currentLang].greeting));
</script>
